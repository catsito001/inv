/* ============================
   UTILIDADES
   ============================ */
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = e => reject(e);
  });
}
/* ============================
   REEMPLAZA TU FUNCIÓN compressImage ACTUAL POR ESTA
   ============================ */
function compressImage(base64Str, maxWidth = 1024, maxHeight = 1024){
  return new Promise((resolve) => {
    const img = new Image();
    img.src = base64Str;
    img.onload = () => {
      let width = img.width;
      let height = img.height;

      // Calculamos la nueva dimensión manteniendo la proporción
      if (width > height) {
        if (width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }
      } else {
        if (height > maxHeight) {
          width *= maxHeight / height;
          height = maxHeight;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // IMPORTANTE: Rellenar de blanco primero para evitar fondos negros
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, width, height);

      // Dibujar la imagen redimensionada
      ctx.drawImage(img, 0, 0, width, height);

      // Exportar a JPG con calidad 0.8 (80%)
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => {
      // Si falla, devolvemos la original con riesgo, pero mejor que nada
      console.warn("Error comprimiendo, usando original");
      resolve(base64Str);
    };
  });
}
function safeFileName(name){ return (name||'SinNombre').replace(/[\/\\:*?"<>|]/g,'-').trim(); }
function escapeHtml(str){ if (!str) return ''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================
   INDEXED DB
   ============================ */
const DB_NAME = 'inventariosDB_v3';
const STORE = 'inventarios';
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const idb = e.target.result;
      if (!idb.objectStoreNames.contains(STORE)) {
        idb.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}
function dbPut(item){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve(true);
    tx.onerror = (e) => reject(e);
  });
}
function dbClear(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e);
  });
}

        { key: 'inst_electricas', label: 'Inst. Eléctricas', placeholder: '¿Luz trifásica, empotrado...?' },
        { key: 'inst_sanitarias', label: 'Inst. Sanitarias', placeholder: '¿Agua fría/caliente...?' }
      ];
      areas.forEach(a => {
        const val = attributes[a.key] || '';
        const div = document.createElement('div');
        div.innerHTML = `
          <label class="block text-xs font-semibold text-slate-600 mb-1.5 ml-1">${a.label}</label>
          <textarea data-attr="${a.key}" rows="2" placeholder="${a.placeholder}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:border-blue-400 focus:outline-none placeholder-slate-400">${escapeHtml(val)}</textarea>
        `;
        extraCont.appendChild(div);
      });
    }
  };

  renderDyn(typeVal);
  document.getElementById('typeSelect').addEventListener('change', (e) => renderDyn(e.target.value));

  const renderPhotos = () => {
    const grid = document.getElementById('photosGrid');
    const btn = grid.firstElementChild;
    grid.innerHTML = '';
    grid.appendChild(btn);

    photos.forEach((p, idx) => {
      const div = document.createElement('div');
      div.className = "aspect-square relative rounded-xl overflow-hidden shadow-sm border border-slate-200";
      div.innerHTML = `
        <img src="${p}" class="w-full h-full object-cover" onclick="editPhoto(${idx})">
        <button type="button" onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md">×</button>
      `;
      grid.appendChild(div);
    });
  };
  
  window.removePhoto = (i) => { photos.splice(i,1); renderPhotos(); };
  window.editPhoto = (i) => { 
    editingPhotoIndex = i; 
    showCropperModal(photos[i], (newB64) => {
      photos[editingPhotoIndex] = newB64;
      editingPhotoIndex = null;
      renderPhotos();
    });
  };

  renderPhotos();

  const fileInp = document.getElementById('hiddenFileInput');
  document.getElementById('addPhotoBtn').addEventListener('click', () => fileInp.click());
  
  fileInp.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if(!files.length) return;
    const doCompress = document.getElementById('compressCheck').checked;
    const btnContent = document.getElementById('addPhotoBtn').innerHTML;
    document.getElementById('addPhotoBtn').innerHTML = '<span class="animate-spin">⌛</span>';
    
    try {
      for(const f of files){
        let b64 = await fileToBase64(f);
        if(doCompress) b64 = await compressImage(b64);
        photos.push(b64);
      }
      renderPhotos();
    } catch(err){ alert('Error al procesar imagen'); console.error(err); }
    finally {
      document.getElementById('addPhotoBtn').innerHTML = btnContent;
      fileInp.value = '';
    }
  });

  document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const attrs = {};
    document.querySelectorAll('[data-attr]').forEach(el => attrs[el.getAttribute('data-attr')] = el.value.trim());

    const newItem = {
      id: editing ? editing.id : Date.now().toString(),
      location: selectedLocation,
      type: document.getElementById('typeSelect').value,
      name: document.getElementById('nameInput').value.trim(),
      attributes: attrs,
      photos: photos,
      createdAt: editing ? editing.createdAt : new Date().toISOString()
    };

    await dbPut(newItem);
    await init();
    showLocationView(selectedLocation);
  });

  document.getElementById('cancelForm').addEventListener('click', () => showLocationView(selectedLocation));
}

/* ============================
   MODAL CROPPER
   ============================ */
function ensureModals(){
  if(!document.getElementById('modal-root')){
    const div = document.createElement('div'); div.id = 'modal-root'; document.body.appendChild(div);
  }
}

function showCropperModal(imgSrc, onSave){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="fixed inset-0 z-[60] bg-black flex flex-col animate-in">
      <div class="flex justify-between items-center p-4 text-white bg-slate-900">
        <button id="cropCancel" class="text-sm text-slate-300 px-2 py-1">Cancelar</button>
        <span class="font-bold">Editar Foto</span>
        <button id="cropSave" class="text-sm bg-blue-600 text-white px-4 py-1.5 rounded-full font-bold">Usar</button>
      </div>
      <div class="flex-1 bg-black relative flex items-center justify-center overflow-hidden">
        <img id="cropperImage" src="${imgSrc}">
      </div>
      <div class="h-20 bg-slate-900 flex items-center justify-around px-4 pb-4 text-white">
        <button id="rotL" class="flex flex-col items-center gap-1 text-xs"><span class="text-xl">↺</span>-90°</button>
        <button id="resetC" class="flex flex-col items-center gap-1 text-xs"><span class="text-xl">⛶</span>Reset</button>
        <button id="rotR" class="flex flex-col items-center gap-1 text-xs"><span class="text-xl">↻</span>+90°</button>
      </div>
    </div>
  `;

  const imgEl = document.getElementById('cropperImage');
  const cropper = new Cropper(imgEl, {
    viewMode: 1,
    dragMode: 'move',
    autoCropArea: 0.9,
    background: false
  });

  document.getElementById('cropCancel').onclick = () => { cropper.destroy(); root.innerHTML = ''; };
  document.getElementById('rotL').onclick = () => cropper.rotate(-90);
  document.getElementById('rotR').onclick = () => cropper.rotate(90);
  document.getElementById('resetC').onclick = () => cropper.reset();
  
  document.getElementById('cropSave').onclick = () => {
    const canvas = cropper.getCroppedCanvas();
    if(canvas){
      const b64 = canvas.toDataURL('image/jpeg', 0.85);
      cropper.destroy(); root.innerHTML = '';
      onSave(b64);
    }
  };
}

/* ============================
   NAVEGACIÓN
   ============================ */
function showHome(){ currentView = 'home'; selectedLocation = null; currentEditId = null; render(); }
function showLocationView(loc){ currentView = 'location'; selectedLocation = loc; currentEditId = null; render(); }
function showFormView(){ currentView = 'form'; render(); }

/* ============================
   IMPORTAR / EXPORTAR
   ============================ */
async function handleExport(){
  const btn = document.getElementById('exportBtn');
  const oldText = btn.innerHTML;
  btn.innerHTML = '...';
  
  try {
    const zip = new JSZip();
    const allItems = await dbGetAll();
    
    // 1. GUARDAR EXCEL (Para humanos)
    const rows = allItems.map(item => {
      const attrs = item.attributes || {};
      const row = {
        'Ubicacion': item.location,
        'Tipo': ITEM_TYPES[item.type]?.label || item.type,
        'Nombre': item.name,
        'Fotos': (item.photos||[]).length,
        'Fecha': new Date(item.createdAt).toLocaleDateString()
      };
      Object.entries(attrs).forEach(([k,v]) => {
        row[k] = v ? v.replace(/\n/g, ' / ') : '';
      });
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Inventario");
    const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    zip.file("Resumen_Inventario.xlsx", excelBuffer);

    // 2. GUARDAR BACKUP JSON COMPLETO (Para la app)
    // Esto asegura que la próxima importación sea 100% exacta y rápida
    zip.file("backup_data.json", JSON.stringify(allItems));

    // 3. GUARDAR FOTOS EN CARPETAS (Para explorar fuera de la app)
    const imgFolder = zip.folder("FOTOS");
    allItems.forEach(item => {
      if(item.photos && item.photos.length){
        const safeLoc = safeFileName(item.location);
        const safeName = safeFileName(item.name);
        const folderName = `${safeLoc}__${safeName}`;
        const itemFolder = imgFolder.folder(folderName);
        
        item.photos.forEach((p, i) => {
          const data = p.split(',')[1];
          if(data) itemFolder.file(`foto_${i+1}.jpg`, data, {base64:true});
        });
      }
    });

    const content = await zip.generateAsync({type:"blob"});
    saveAs(content, `Inventario_${new Date().toISOString().slice(0,10)}.zip`);

  } catch(e) {
    console.error(e);
    alert('Error exportando. Ver consola.');
  } finally {
    btn.innerHTML = oldText;
  }
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const btn = document.getElementById('importBtn');
  const originalText = btn ? btn.innerHTML : 'Importar';
  if(btn) btn.innerHTML = '⏳';

  try {
    const zip = await JSZip.loadAsync(file);
    let itemsToRestore = [];

    // ESTRATEGIA 1: Buscar backup_data.json (Creado por la nueva exportación)
    if (zip.file("backup_data.json")) {
      console.log("Encontrado backup JSON. Restaurando fidelidad 100%...");
      const jsonStr = await zip.file("backup_data.json").async("string");
      itemsToRestore = JSON.parse(jsonStr);
    } 
    // ESTRATEGIA 2: Reconstruir desde Excel + Fotos (Legacy ZIP)
    else {
      console.log("JSON no encontrado. Reconstruyendo desde Excel + Fotos...");
      
      // Leer Excel
      const excelFile = zip.file("Resumen_Inventario.xlsx") || Object.values(zip.files).find(f => f.name.endsWith('.xlsx'));
      if(!excelFile) throw new Error("No se encontró archivo Excel en el ZIP");
      
      const excelData = await excelFile.async("arraybuffer");
      const workbook = XLSX.read(excelData, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet); // Array de objetos planos

      for (let row of rows) {
        // Mapeo inverso básico
        const loc = row['Ubicacion'];
        const name = row['Nombre'];
        const typeLabel = row['Tipo'];
        
        // Encontrar clave de tipo por label
        let typeKey = 'EDIFICACION'; // default
        for(const [k, v] of Object.entries(ITEM_TYPES)){
          if(v.label === typeLabel) typeKey = k;
        }

        // Extraer atributos
        const attrs = {};
        for(const key in row){
          if(['Ubicacion','Tipo','Nombre','Fotos','Fecha'].includes(key)) continue;
          attrs[key] = String(row[key]);
        }

        // Recuperar Fotos de la carpeta
        const photos = [];
        const safeLoc = safeFileName(loc);
        const safeName = safeFileName(name);
        const folderPrefix = `FOTOS/${safeLoc}__${safeName}/`;
        
        // Buscar archivos en esa carpeta dentro del ZIP
        const photoFiles = Object.keys(zip.files).filter(path => path.startsWith(folderPrefix) && !zip.files[path].dir);
        
        // Ordenar fotos para mantener orden (foto_1, foto_2...)
        photoFiles.sort((a,b) => {
          const numA = parseInt(a.match(/foto_(\d+)/)?.[1] || 0);
          const numB = parseInt(b.match(/foto_(\d+)/)?.[1] || 0);
          return numA - numB;
        });

        for(const phPath of photoFiles){
            const b64 = await zip.file(phPath).async("base64");
            photos.push("data:image/jpeg;base64," + b64);
        }

        itemsToRestore.push({
          id: Date.now().toString() + Math.random().toString().slice(2,6),
          location: loc,
          name: name,
          type: typeKey,
          attributes: attrs,
          photos: photos,
          createdAt: new Date().toISOString()
        });
      }
    }

    if(itemsToRestore.length > 0){
      await dbClear(); // Limpiar BD actual
      for(const item of itemsToRestore){
        await dbPut(item);
      }
      alert(`¡Carga exitosa!\nSe recuperaron ${itemsToRestore.length} registros.`);
      // Reiniciar
      location.reload(); 
    } else {
      alert("No se encontraron registros válidos en el archivo.");
    }

  } catch (err) {
    console.error(err);
    alert("Error al leer el archivo ZIP:\n" + err.message);
  } finally {
    if(btn) btn.innerHTML = originalText;
    e.target.value = ''; // Reset input
  }
}

init();

</script>
